version: "3.9"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: agonistes-tsdb
    restart: unless-stopped
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: agonistes
      POSTGRES_PASSWORD: ${TSDB_PASSWORD}
      POSTGRES_DB: agonistes
    volumes:
      - ./databases/timescaledb/data:/var/lib/postgresql/data
      - ./databases/timescaledb/init:/docker-entrypoint-initdb.d
    shm_size: "2g"
    command: >
      postgres
        -c shared_preload_libraries=timescaledb
        -c shared_buffers=4GB
        -c work_mem=512MB
        -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agonistes -d agonistes"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TimescaleDB Prometheus metrics sidecar (scraped at :9187)
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: agonistes-pg-exporter
    restart: unless-stopped
    ports: ["9187:9187"]
    environment:
      DATA_SOURCE_NAME: "postgresql://agonistes:${TSDB_PASSWORD}@timescaledb:5432/agonistes?sslmode=disable"
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9187/metrics >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agonistes-qdrant
    restart: unless-stopped
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - ./databases/qdrant/storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: agonistes-neo4j
    restart: unless-stopped
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      # Neo4j exposes Prometheus metrics on :2004 (community)
      NEO4J_server_metrics_prometheus_enabled: "true"
      NEO4J_server_metrics_prometheus_endpoint: "0.0.0.0:2004"
    volumes:
      - ./databases/neo4j/data:/data
      - ./databases/neo4j/plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # LangGraph state checkpointing + rate limiting (GAP 3)
  redis:
    image: redis:7-alpine
    container_name: agonistes-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./databases/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: agonistes-prometheus
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"

  grafana:
    image: grafana/grafana:latest
    container_name: agonistes-grafana
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/system_health.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
