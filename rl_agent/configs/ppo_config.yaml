algorithm: PPO
policy: MlpPolicy
learning_rate: 3.0e-4
n_steps: 2048
batch_size: 64
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
policy_kwargs:
  net_arch: [256, 256, 128]
total_timesteps: 1000000
eval_freq: 10000
n_eval_episodes: 20
reward_threshold: 1.5     # Target Sharpe ratio
