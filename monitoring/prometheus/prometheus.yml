# Prometheus scrape config for Project Agonistes (all services).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "agonistes-api"
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: "timescaledb"
    static_configs:
      - targets: ["timescaledb:9187"]   # postgres_exporter sidecar

  - job_name: "qdrant"
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]

  - job_name: "neo4j"
    metrics_path: /metrics
    static_configs:
      - targets: ["neo4j:2004"]         # Neo4j Prometheus metrics endpoint
