# Prometheus scrape config for Project Agonistes.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "agonistes-api"
    static_configs:
      - targets: ["host.docker.internal:8000"]
  - job_name: "timescaledb"
    static_configs:
      - targets: ["timescaledb:9187"]   # pg_exporter (add when wired)
