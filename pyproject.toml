[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agonistes"
version = "0.1.0"
description = "Project Agonistes — multi-asset paper trading + backtesting platform (TFT + LangGraph debate + RL execution)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "ta==0.11.0",
    "yfinance>=0.2.40",
    "lxml>=5.0",            # yfinance earnings-calendar HTML parsing
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.5",
    "websockets>=12.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "pytorch-forecasting>=1.0",
    "lightning>=2.2",
    "shap>=0.44",
]
llm = [
    "openai>=1.30",
    "instructor>=1.3",
    "langgraph>=0.2",
]
rl = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
]
db = [
    "psycopg2-binary>=2.9",
    "qdrant-client>=1.9",
    "neo4j>=5.20",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
agonistes = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "data_ingestion*", "screener*", "feature_engineering*",
           "transformer_model*", "rl_agent*", "portfolio_manager*",
           "backtesting*", "monitoring*", "scripts*", "databases*"]

[tool.ruff]
line-length = 110
